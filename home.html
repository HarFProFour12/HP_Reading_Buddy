<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Harry Potter Reading Companion</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="main_style.css">
        <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="all">
            <div id="menu">
                <a href="home.html"><div class="menu-item"><p>Home</p></div></a>
                <a href="books.html"><div class="menu-item"><p>Books</p></div></a>
                <a href="stats.html"><div class="menu-item"><p>Stats</p></div></a>
                <a href="achievements.html"><div class="menu-item"><p>Achievements</p></div></a>
                <a href="settings.html"><div class="menu-item"><p>Settings</p></div></a>
            </div>
            <div id="main-app">
                <h1 id="welcome"></h1>
                <h3 id="slogan"></h3>

                <div id="reading-timer"> 
                    <h2>Reading Timer</h2> 

                    <div id="hr2">
                        <hr class="divider">
                    </div>
                    
                    <p id="timer-display">00:00:00</p>  

                    <button id="start-pause">Start Reading</button>
                    <button id="reset" hidden>Reset</button>
                    <button id="finish" hidden>Finish &amp; Save</button>
                </div>          

                <div id="books-read">
                    <h2>Books I've Read<span id="books-count">0 out of 7 read</span></h2>

                    <label>
                        <input type="checkbox" id="book1">
                        Harry Potter and the Philosopher's Stone
                    </label>

                    <label>
                        <input type="checkbox" id="book2">
                        Harry Potter and the Chamber of Secrets
                    </label>
                    
                    <label>
                        <input type="checkbox" id="book3">
                        Harry Potter and the Prisoner of Azkaban
                    </label>
                    
                    <label>
                        <input type="checkbox" id="book4">
                        Harry Potter and the Goblet of Fire
                    </label>
                    
                    <label>
                        <input type="checkbox" id="book5">
                        Harry Potter and the Order of the Phoenix
                    </label>
                    
                    <label>
                        <input type="checkbox" id="book6">
                        Harry Potter and the Half-Blood Prince
                    </label>                    

                    <label>
                        <input type="checkbox" id="book7">
                        Harry Potter and the Deathly Hallows
                    </label>                 
                </div>                
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
